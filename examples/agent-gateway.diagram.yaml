id: agent-gateway
title: Agent Gateway
note: The architecture, and one chat message's round trip through it.
panels:
  - id: architecture
    title: Architecture
    layout: graph
    direction: LR
    nodes:
      - { id: client, label: Chat client }
      - { id: gateway, label: Gateway, color: blue }
      - { id: host, label: Agent host, color: green }
    edges:
      - { from: client, to: gateway, label: message }
      - { from: gateway, to: host, label: dispatch }
  - id: chat-roundtrip
    title: One chat message, end to end
    layout: sequence
    actors:
      - { id: client, label: Client }
      - { id: gateway, label: Gateway }
      - { id: host, label: Host }
    messages:
      - { from: client, to: gateway, label: send message }
      - { from: gateway, to: host, label: run }
      - { from: host, to: gateway, label: result, style: return }
      - { from: gateway, to: client, label: reply, style: return }

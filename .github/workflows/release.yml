name: Release

# Cutting a release is two steps: bump the version in the four workspace
# package.json files (in a normal PR, reviewed like any other change), then
# push a `vX.Y.Z` tag on the commit where that landed:
#
#   git tag v0.1.1 <sha>
#   git push origin v0.1.1
#
# This workflow then builds, tests, verifies every package actually agrees
# with the tag, and STAGES all four to npm — it does not publish them live.
#
# Publishing uses npm Trusted Publishing (OIDC) — no npm token stored
# anywhere — with this repo's Trusted Publisher configured for stage-only
# access. That's an intentional human gate that staged publishing exists
# to provide: an OIDC/CI token can never approve a staged package, only a
# person with 2FA can (via `npm stage approve <id>` or npmjs.com). So once
# this job finishes, go approve the four staged packages yourself — server
# depends on core+web, and cli depends on core+server, so approve core and
# web first, then server, then cli — and once they're live, create the
# release yourself too (it needs no token, so it doesn't earn its own
# workflow):
#
#   gh release create vX.Y.Z --generate-notes

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write # required for npm's OIDC trusted-publishing exchange

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # staged publishing needs npm >= 11.15.0; don't rely on whatever a
      # given runner image happens to bundle with Node 22
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm run test

      - name: Verify every package version matches the tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          status=0
          for pkg in core web server cli; do
            pkg_version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$pkg_version" != "$tag_version" ]; then
              echo "packages/$pkg is at $pkg_version, but tag $GITHUB_REF_NAME expects $tag_version" >&2
              status=1
            fi
          done
          exit "$status"

      # order here is cosmetic — staging doesn't make anything live, so
      # there's no dependency to resolve yet. Kept in the same order as the
      # approval sequence below so the two stay easy to eyeball together.
      - name: Stage packages on npm
        run: |
          set -euo pipefail
          npm stage publish -w gameplan-core
          npm stage publish -w gameplan-web
          npm stage publish -w gameplan-server
          npm stage publish -w gameplan-cli

      - name: Next steps
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Staged for $GITHUB_REF_NAME — not live yet

          All four packages are staged, not published. Approve each with
          2FA — in this order, since \`gameplan-server\` depends on
          \`gameplan-core\`+\`gameplan-web\`, and \`gameplan-cli\` depends
          on \`gameplan-core\`+\`gameplan-server\`:

          1. \`gameplan-core\`
          2. \`gameplan-web\`
          3. \`gameplan-server\`
          4. \`gameplan-cli\`

          Approve via \`npm stage approve <stage-id>\` (see \`npm stage list\`)
          or on npmjs.com. Once all four are live:

          \`\`\`
          gh release create $GITHUB_REF_NAME --generate-notes
          \`\`\`
          EOF
